# Nido Configuration
# Location: ~/.config/nido/config.toml

[assistant]
name = "Nido"
language = "en"

[hotkey]
# Push-to-talk / Realtime dual-mode key. Default is F9.
key = "KEY_F9"
# Optional evdev device path, e.g. "/dev/input/event3". Empty string enables auto-discovery.
device = ""
# Duration in milliseconds to distinguish single press (tap) from hold
mode_threshold_ms = 300

[audio]
# Optional sounddevice device name or index. Empty string uses default input device.
device = ""
sample_rate = 16000
channels = 1
max_seconds = 30
# In-memory pre-buffer duration in milliseconds to prevent lost speech at keypress
prebuffer_ms = 400

[ui]
# Position on screen: "top-right", "top-left", "bottom-right", "bottom-left"
position = "top-right"
# Auto-hide timeout in milliseconds after completion
timeout_ms = 4000
# Compact UI mode
compact = false

[stt]
# Local directory for NVIDIA Nemotron Speech Streaming EN 0.6B Q8 GGUF model
model_dir = "~/.local/share/nido/models/nemotron-speech-streaming-en-0.6b"
model_file = "nemotron-speech-streaming-en-0.6b.q8_0.gguf"
hf_repo_id = "nvidia/nemotron-speech-streaming-en-0.6b"
# Optimal threads for Intel i5-7300U (2 cores, 4 threads, AVX2)
threads = 4
provider = "cpu"
decoding_method = "greedy_search"
enable_endpoint_detection = true
rule1_min_trailing_silence = 0.8
rule2_min_trailing_silence = 0.6
rule3_min_utterance_length = 20.0

[realtime]
enabled = true
max_pending_commands = 8
partial_update_interval_ms = 80
finalization_timeout_ms = 1500
show_transcript_history = true
transcript_history_size = 5
dispatch_stable_partials = false

[laya]
# Local directory for Laya multilingual MLX model
enabled = true
model_dir = "~/.local/share/nido/models/laya-multilingual-mlx"
dtype = "float16"
device = "auto"
batch_size = 16
compile = true
cache_prompts = true
pad_to_multiple = 16
max_elements = 120
max_candidates = 24
shortlist_size = 20

[desktop]
enabled = true
max_steps = 24
max_elements = 120
max_depth = 32
settle_delay_ms = 120
action_timeout_ms = 2000
snapshot_timeout_ms = 1500
include_invisible = false
include_offscreen = false
accessibility_backend = "auto"
input_backend = "auto"

[apps]
# Whitelist and aliases for open_app tool
browser = "firefox"
chrome = "google-chrome"
terminal = "konsole"
editor = "code"
file_manager = "dolphin"
files = "dolphin"
calculator = "kcalc"
settings = "systemsettings"
music = "elisa"
telegram = "telegram-desktop"
discord = "discord"

[system]
auto_start = true
# Dangerous commands disabled by default
allow_shutdown = false
allow_reboot = false
