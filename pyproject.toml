[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nido"
version = "0.1.0"
description = "Lightweight, fully offline Persian voice command assistant for KDE Plasma/Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Nido Contributors" }
]
keywords = ["voice-assistant", "persian", "kde", "linux", "offline", "stt", "push-to-talk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: KDE",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment :: K Desktop Environment (KDE)",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "numpy>=1.24.0",
    "sounddevice>=0.4.6",
    "evdev>=1.6.0",
    "sherpa-onnx>=1.9.0",
    "ctranslate2>=3.20.0",
    "sentencepiece>=0.1.99",
    "cactus-needle>=0.1.0",
    "pyside6>=6.5.0",
    "huggingface_hub>=0.20.0",
    "torch>=2.0.0",
    "PyGObject>=3.42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
nido = "nido.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nido"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
